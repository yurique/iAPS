name: Recover MATCH_PASSWORD
run-name: Recover MATCH_PASSWORD (encrypted to fixed recovery key)

# One-off, manually-triggered recovery of the MATCH_PASSWORD secret value.
# It encrypts the secret to a fixed public key (the RECOVERY_AGE_RECIPIENT secret)
# and prints the ciphertext. Only your private key can decrypt it, so the output is
# safe in a public Actions log. The recipient is a secret, NOT an input, so whoever
# triggers the run cannot redirect the ciphertext to their own key. The plaintext
# password is never printed.
#
# Setup:
#   1. Add secret RECOVERY_AGE_RECIPIENT = your age public key (age1...) OR an ssh
#      public key line (ssh-ed25519 AAAA... / ssh-rsa AAAA...), in the repo that has
#      the MATCH_PASSWORD secret.
#   2. Actions -> "Recover MATCH_PASSWORD" -> Run workflow (pick this branch).
#   3. Copy the ENCRYPTED block from the log and decrypt it locally:
#        age --decrypt -i ~/.ssh/id_ed25519 secret.age
#   4. Delete this branch, the run, and the RECOVERY_AGE_RECIPIENT secret.

on:
  workflow_dispatch:

permissions: {}          # no repo access needed; this job only reads secrets

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Encrypt MATCH_PASSWORD to the recovery key
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          RECIPIENT: ${{ secrets.RECOVERY_AGE_RECIPIENT }}
        run: |
          if [ -z "$RECIPIENT" ]; then
            echo "::error::RECOVERY_AGE_RECIPIENT secret is not set."
            exit 1
          fi
          printf '%s\n' "$RECIPIENT" > recipient.txt
          echo "----- BEGIN ENCRYPTED MATCH_PASSWORD -----"
          printf '%s' "$MATCH_PASSWORD" | age --armor -R recipient.txt
          echo "----- END ENCRYPTED MATCH_PASSWORD -----"
